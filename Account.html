<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomify | Login</title>
    <link rel="stylesheet" href="Account Style.css">

</head>

<body>


    <!-- ACCOUNT SECTION -->
    <section class="account-section">

        <div class="account-card">

            <!-- LEFT -->
            <div class="account-image">

                <div class="image-overlay">

                </div>

            </div>


            <!-- RIGHT -->
            <div class="login-area">

                <p class="subtitle">
                    WELCOME TO BLOOMIFY
                </p>

                <h1>
                    Welcome Back.
                </h1>

                <p class="description">
                    Login to your account and discover
                    beautiful flowers made for every moment.
                </p>


                <!-- LOGIN FORM -->
                <form>

                    <div class="input-box">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                        >

                    </div>


                    <div class="input-box">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="register">
                    Don't have an account?
                    <a href="#">Create one</a>
                </p>

            </div>

        </div>

    </section>

</body>
</html>
